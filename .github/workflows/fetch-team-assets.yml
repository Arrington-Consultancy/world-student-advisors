name: Import controlled OUR TEAM assets (read only)

# Manual only. Downloads the approved team photographs and the two
# consent-evidenced British Council certificates from the controlled
# SharePoint folder 16_WEBSITE_Ai/06 Counsellors, and commits them to the
# repository so the public OUR TEAM page can serve them.
#
# The build container has no Graph credentials, so this runs the import
# inside the Railway service via `railway run`, reusing the dedicated
# SHAREPOINT_GRAPH_* application already trusted for read-only SharePoint
# access. Never prints a token or secret. Writes nothing to SharePoint.
on:
  workflow_dispatch:
    inputs:
      service_name:
        description: "Railway app service name"
        required: true
        default: "world-student-advisors"
      environment_name:
        description: "Railway environment name"
        required: true
        default: "production"
      target_branch:
        description: "Branch to commit the imported assets to"
        required: true
        default: "main"

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Import the controlled assets
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          railway run \
            --service "${{ github.event.inputs.service_name }}" \
            --environment "${{ github.event.inputs.environment_name }}" \
            -- node scripts/fetch-team-assets.mjs
      - name: Commit the imported assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add client/public/team
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "Import controlled OUR TEAM photographs and consented certificates from SharePoint"
          git push origin HEAD:${{ github.event.inputs.target_branch }}
      - name: Show what was imported
        run: ls -l client/public/team client/public/team/certificates
