name: Migration 0005 read-only pre-check

# Manual-only. Runs scripts/migration-precheck.mjs — strictly read-only
# against the DATABASE (SHOW TABLES + SELECT from drizzle's own
# __drizzle_migrations bookkeeping table; no DDL, no writes, no
# business-table row data) — against the real production Railway MySQL.
#
# Connection method: the app service's DATABASE_URL references the MySQL
# service's PRIVATE URL (mysql.railway.internal), which is unreachable from
# GitHub-hosted runners (confirmed ENOTFOUND on a prior run — see
# provision-portal-database.yml, whose proven public-proxy dance this
# mirrors exactly): discover the public-URL variable NAME on the MySQL
# service (key only, value never printed), set a temporary
# PRECHECK_DATABASE_URL reference on the app service (reference syntax
# only — the actual connection string is never read or printed), run the
# read-only script against it, then remove the temporary variable.
#
# Auth: githubactionsprod — the same production-scoped Railway Project
# Token production-db-diagnostic.yml and provision-portal-database.yml use.
on:
  workflow_dispatch:
    inputs:
      service_name:
        description: "Railway app service name"
        required: true
        default: "world-student-advisors"
      environment_name:
        description: "Railway environment name"
        required: true
        default: "production"
      database_service_name:
        description: "Railway MySQL service name"
        required: true
        default: "MySQL"

jobs:
  precheck:
    runs-on: ubuntu-latest
    env:
      APP_SERVICE_NAME: ${{ github.event.inputs.service_name }}
      APP_ENV_NAME: ${{ github.event.inputs.environment_name }}
      DB_SERVICE_NAME: ${{ github.event.inputs.database_service_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Discover the MySQL service's public-URL variable NAME (key only, value never printed)
        id: discover
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          KEYS=$(railway variables --service "$DB_SERVICE_NAME" --environment "$APP_ENV_NAME" --json | jq -r 'keys[]')
          echo "Variable names found on $DB_SERVICE_NAME (names only):"
          echo "$KEYS"
          PUBLIC_KEY=$(echo "$KEYS" | grep -i -E '^(MYSQL_PUBLIC_URL|DATABASE_PUBLIC_URL)$' | head -n1)
          if [ -z "$PUBLIC_KEY" ]; then
            echo "No public-URL-shaped variable found on $DB_SERVICE_NAME. Stopping — not guessing further."
            exit 1
          fi
          echo "Using public URL variable: $PUBLIC_KEY"
          echo "public_key=$PUBLIC_KEY" >> "$GITHUB_OUTPUT"

      - name: Set a temporary public-reachable pre-check URL on the app service
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
          PUBLIC_KEY: ${{ steps.discover.outputs.public_key }}
        run: |
          REF=$(printf '\044{{%s.%s}}' "$DB_SERVICE_NAME" "$PUBLIC_KEY")
          railway variables \
            --service "$APP_SERVICE_NAME" \
            --environment "$APP_ENV_NAME" \
            --set "PRECHECK_DATABASE_URL=${REF}"

      - name: Run read-only migration pre-check against production
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          railway run --service "$APP_SERVICE_NAME" --environment "$APP_ENV_NAME" -- \
            sh -c 'DATABASE_URL="$PRECHECK_DATABASE_URL" node scripts/migration-precheck.mjs'

      - name: Remove the temporary pre-check URL variable
        if: always()
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          railway variables \
            --service "$APP_SERVICE_NAME" \
            --environment "$APP_ENV_NAME" \
            --set "PRECHECK_DATABASE_URL="
