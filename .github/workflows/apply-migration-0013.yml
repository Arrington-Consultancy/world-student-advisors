name: Apply migration 0013 (Staff Portal link sets the password)

# Manual-only, one-time, SEPARATELY AUTHORISED step (authorisation limited
# to migration 0013). Mirrors the proven method of apply-migration-0012.yml:
# discover the MySQL public-URL variable NAME, set MIGRATION_DATABASE_URL as
# a Railway reference (the connection string is never read or printed), run
# a read-only pre-check, apply with `drizzle-kit migrate`, verify, run the
# migrator a second time to prove idempotence, verify again, and always
# clear the temporary variable.
#
# 0013 CHANGES AN EXISTING COLUMN, unlike 0012, and its pre-check is written
# for that rather than copied. It does two things:
#   1. widens staff_signup_requests.passwordHash from NOT NULL to NULL;
#   2. adds staff_signup_requests.purpose (NOT NULL, default 'signup').
# The widening is the only change to an existing column. It cannot fail on
# rows that already exist and cannot lose data, and the added column carries
# a default so no existing row is left undefined. The verifier proves both
# after the fact. scripts/precheck-0013.mjs allows exactly these two
# statements by shape and stops on anything else, including any other ALTER,
# and any DROP, DELETE, TRUNCATE, RENAME, UPDATE or INSERT.
#
# What it enables: Tom Arrington's correction of 9 September 2026 that staff
# "sign up, get an email to their inbox and set the password there", with a
# forgot-password route alongside. The password is no longer collected on the
# signup form, so a pending row genuinely holds none and the NOT NULL
# constraint would refuse every insert. That is not only a shape change: it
# closes a real hole, because under 0012 whoever filled in the form chose the
# password for an address they might not own.
#
# Rollback would require a narrowing MODIFY and a DROP COLUMN, both
# destructive, and is deliberately not provided. The nullable column and the
# defaulted column cost nothing if unused.
#
# Auth: githubactionsprod — the same production-scoped Railway Project
# Token the other production workflows use. No credential is read, printed
# or handled by a person at any point.
on:
  workflow_dispatch:
    inputs:
      service_name:
        description: "Railway app service name"
        required: true
        default: "world-student-advisors"
      environment_name:
        description: "Railway environment name"
        required: true
        default: "production"
      database_service_name:
        description: "Railway MySQL service name"
        required: true
        default: "MySQL"

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      APP_SERVICE_NAME: ${{ github.event.inputs.service_name }}
      APP_ENV_NAME: ${{ github.event.inputs.environment_name }}
      DB_SERVICE_NAME: ${{ github.event.inputs.database_service_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Discover the MySQL service's public-URL variable NAME (key only, value never printed)
        id: discover
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          KEYS=$(railway variables --service "$DB_SERVICE_NAME" --environment "$APP_ENV_NAME" --json | jq -r 'keys[]')
          PUBLIC_KEY=$(echo "$KEYS" | grep -i -E '^(MYSQL_PUBLIC_URL|DATABASE_PUBLIC_URL)$' | head -n1)
          if [ -z "$PUBLIC_KEY" ]; then
            echo "No public-URL-shaped variable found on $DB_SERVICE_NAME. Stopping — not guessing further."
            exit 1
          fi
          echo "Using public URL variable: $PUBLIC_KEY"
          echo "public_key=$PUBLIC_KEY" >> "$GITHUB_OUTPUT"

      - name: Set a temporary public-reachable migration URL on the app service
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
          PUBLIC_KEY: ${{ steps.discover.outputs.public_key }}
        run: |
          REF=$(printf '\044{{%s.%s}}' "$DB_SERVICE_NAME" "$PUBLIC_KEY")
          railway variables \
            --service "$APP_SERVICE_NAME" \
            --environment "$APP_ENV_NAME" \
            --set "MIGRATION_DATABASE_URL=${REF}"

      - name: Confirm 0013 is the only pending migration (read-only; stops rather than guessing)
        timeout-minutes: 10
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          railway run --service "$APP_SERVICE_NAME" --environment "$APP_ENV_NAME" -- \
            sh -c 'DATABASE_URL="$MIGRATION_DATABASE_URL" node scripts/precheck-0013.mjs'

      - name: Apply migration 0013 (drizzle-kit migrate)
        timeout-minutes: 10
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          railway run --service "$APP_SERVICE_NAME" --environment "$APP_ENV_NAME" -- \
            sh -c 'DATABASE_URL="$MIGRATION_DATABASE_URL" pnpm exec drizzle-kit migrate'

      - name: Read-only post-migration verification
        timeout-minutes: 10
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          railway run --service "$APP_SERVICE_NAME" --environment "$APP_ENV_NAME" -- \
            sh -c 'DATABASE_URL="$MIGRATION_DATABASE_URL" node scripts/verify-0013.mjs'

      - name: Re-run the migrator to prove it is idempotent (applies nothing the second time)
        timeout-minutes: 10
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          railway run --service "$APP_SERVICE_NAME" --environment "$APP_ENV_NAME" -- \
            sh -c 'DATABASE_URL="$MIGRATION_DATABASE_URL" pnpm exec drizzle-kit migrate'

      - name: Verify again — the second migrate run changed nothing
        timeout-minutes: 10
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          railway run --service "$APP_SERVICE_NAME" --environment "$APP_ENV_NAME" -- \
            sh -c 'DATABASE_URL="$MIGRATION_DATABASE_URL" node scripts/verify-0013.mjs'

      - name: Remove the temporary migration URL variable
        if: always()
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          railway variables \
            --service "$APP_SERVICE_NAME" \
            --environment "$APP_ENV_NAME" \
            --set "MIGRATION_DATABASE_URL="
