name: Deploy preview to Railway

# Manual-only on purpose: this deploys to a separate, throwaway Railway
# project/service for previewing the site, never the real WSA domain or
# the live Arrington hosting.
#
# Auth: RAILWAY_TOKEN is a Railway *Project Token* (not an account/workspace
# API token, which uses a different variable, RAILWAY_API_TOKEN, and is
# broader-scoped than this workflow needs). A Project Token is scoped to
# one project (and, if offered at creation time, one environment within
# it) and can only perform deployment-related actions there — it cannot
# reach any other Railway project, so this stays isolated to the preview
# project regardless of what else exists in the account.
#
# To generate one (current Railway dashboard, mid-2026): open the
# THROWAWAY PREVIEW project in Railway (not the live/production project,
# and not a service inside it) -> Project Settings -> Tokens tab ->
# Create Token. If the creation dialog offers an environment scope, pick
# the preview project's own environment, not "production" in any project
# that matters. This is a *project-level* setting, not a *service-level*
# one — service Settings does not have a Tokens tab, which is why it
# won't appear if you're looking there.
#
# Once generated, add it as a repo secret: GitHub repo -> Settings ->
# Secrets and variables -> Actions -> New repository secret -> name it
# RAILWAY_TOKEN exactly -> paste the project token as the value. Also
# requires a service inside that preview project named to match
# SERVICE_NAME below.
on:
  workflow_dispatch:

env:
  SERVICE_NAME: world-student-advisors
  RAILWAY_ENV: production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Diagnose Railway target (no secret values printed)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "== railway --version =="
          railway --version || true
          echo "== railway whoami =="
          railway whoami || true
          echo "== railway status =="
          railway status || true
          echo "== railway service (list services in linked project) =="
          railway service || true
          echo "== railway environment (list environments) =="
          railway environment || true
          echo "== railway variables --service $SERVICE_NAME --environment $RAILWAY_ENV --json (names/lengths/prefix only, no values) =="
          railway variables --service "$SERVICE_NAME" --environment "$RAILWAY_ENV" --json > /tmp/vars.json 2> /tmp/vars.err || true
          cat /tmp/vars.err || true
          node -e "
            try {
              const raw = require('fs').readFileSync('/tmp/vars.json', 'utf8');
              const vars = JSON.parse(raw);
              for (const [k, v] of Object.entries(vars)) {
                const s = String(v ?? '');
                console.log(k, '| length=' + s.length, '| prefix=' + (s.slice(0, 13) || '(empty)'));
              }
            } catch (e) {
              console.log('Could not parse railway variables output:', e.message);
            }
          "

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service "$SERVICE_NAME" --environment "$RAILWAY_ENV" --detach

      - name: Print the generated Railway domain (if any)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway domain --service "$SERVICE_NAME" --environment "$RAILWAY_ENV" || true
