name: Production DB read-only diagnostic

# Manual-only. Runs a single hardcoded read-only query
# (scripts/prod-db-diagnostic.mjs: SHOW COLUMNS FROM portal_users)
# against the REAL production Railway service, using the same
# connection method server/db.ts uses. Prints column metadata only —
# never row data, never DATABASE_URL or any secret value.
#
# Auth: githubactionsprod is a Railway Project Token scoped to the
# real production project/environment (distinct from RAILWAY_TOKEN,
# which deploy-preview.yml uses for the throwaway preview project).
# Added at: repo Settings -> Secrets and variables -> Actions ->
# Repository secrets -> githubactionsprod.
on:
  workflow_dispatch:
    inputs:
      service_name:
        description: "Railway service name"
        required: true
        default: "world-student-advisors"
      environment_name:
        description: "Railway environment name"
        required: true
        default: "production"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Identify target (no secret values printed)
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          railway --version || true
          railway whoami || true
          railway status || true
          railway service || true
          railway environment || true

      - name: Set a temporary public-reachable read URL on the app service (removed after this run)
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          REF=$(printf '\044{{MySQL.MYSQL_PUBLIC_URL}}')
          railway variables \
            --service "${{ github.event.inputs.service_name }}" \
            --environment "${{ github.event.inputs.environment_name }}" \
            --set "VERIFY_DATABASE_URL=${REF}"

      - name: Run read-only schema check against production (via public proxy)
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          railway run --service "${{ github.event.inputs.service_name }}" --environment "${{ github.event.inputs.environment_name }}" -- \
            sh -c 'DATABASE_URL="$VERIFY_DATABASE_URL" node scripts/prod-db-diagnostic.mjs'

      - name: Remove the temporary read URL variable
        if: always()
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          railway variables \
            --service "${{ github.event.inputs.service_name }}" \
            --environment "${{ github.event.inputs.environment_name }}" \
            --set "VERIFY_DATABASE_URL="

      - name: Recent app service logs (grepped for Database/error signals only)
        if: always()
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          railway logs --service "${{ github.event.inputs.service_name }}" --environment "${{ github.event.inputs.environment_name }}" 2>&1 \
            | grep -iE "database|portal|error|unavailable|econn|etimedout|enotfound" \
            | tail -n 100 || echo "(no matching log lines, or railway logs unsupported in this CLI version)"
