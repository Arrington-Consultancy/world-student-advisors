name: Production DB read-only diagnostic

# Manual-only, read-only. Runs scripts/prod-db-diagnostic.mjs against the
# REAL production database via the MySQL service's public-proxy URL
# (MYSQL_PUBLIC_URL) — DATABASE_URL, which server/db.ts and the app itself
# use, is Railway's private internal hostname and unreachable from a
# GitHub-hosted runner. Never writes anything. Prints table/column metadata
# and drizzle-kit's own migration-bookkeeping rows (hash + timestamp, not
# personal data) — never student/applicant row data, never any secret value.
#
# Auth: githubactionsprod is a Railway Project Token scoped to the
# real production project/environment (distinct from RAILWAY_TOKEN,
# which deploy-preview.yml uses for the throwaway preview project).
# Added at: repo Settings -> Secrets and variables -> Actions ->
# Repository secrets -> githubactionsprod.
on:
  workflow_dispatch:
    inputs:
      database_service_name:
        description: "Railway MySQL service name (running the script against this service, not the app service, injects the public-proxy URL — DATABASE_URL's private hostname is unreachable from this runner)"
        required: true
        default: "MySQL"
      environment_name:
        description: "Railway environment name"
        required: true
        default: "production"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Identify target (no secret values printed)
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          railway --version || true
          railway whoami || true
          railway status || true
          railway service || true
          railway environment || true

      - name: Run read-only schema check against production
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          railway run --service "${{ github.event.inputs.database_service_name }}" --environment "${{ github.event.inputs.environment_name }}" -- node scripts/prod-db-diagnostic.mjs
