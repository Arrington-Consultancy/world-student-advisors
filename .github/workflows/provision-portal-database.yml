name: Provision portal database (one-time)

# Manual-only, one-time infrastructure step. Adds a MySQL database to the
# production Railway project, points the app service's DATABASE_URL at it
# via Railway's own variable-reference syntax (built at runtime with printf,
# never written literally in this file — see below), so this workflow never
# reads or prints the actual connection string/credentials. Then runs the
# drizzle migration (pnpm run db:push) against it using a temporary
# reference variable for public reachability from this runner.
#
# Safety: every step below prints service/variable NAMES only, never
# values. If a step fails, this workflow does not attempt alternative
# approaches — it stops so the actual error can be reviewed.
#
# Note: GitHub Actions' own expression parser intercepts the literal
# 3-character sequence dollar-brace-brace anywhere in a run: block's raw
# text, even inside quotes — including Railway's own unrelated
# variable-reference syntax, which uses the identical delimiters. Every
# input below is passed through env: and referenced as a shell variable;
# Railway's reference strings are assembled at runtime via printf's octal
# escape specifically so that sequence never appears literally in this file.
on:
  workflow_dispatch:
    inputs:
      service_name:
        description: "Railway app service name"
        required: true
        default: "world-student-advisors"
      environment_name:
        description: "Railway environment name"
        required: true
        default: "production"
      database_service_name:
        description: "Name to expect/assign for the new MySQL database service"
        required: true
        default: "MySQL"

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      APP_SERVICE_NAME: ${{ github.event.inputs.service_name }}
      APP_ENV_NAME: ${{ github.event.inputs.environment_name }}
      DB_SERVICE_NAME: ${{ github.event.inputs.database_service_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Confirm project/environment context (no secrets)
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          railway --version
          railway whoami || true
          railway status || true

      - name: Add MySQL database to the project
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          railway add --database mysql

      - name: List services after provisioning (names only, no secrets)
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          railway status

      - name: Point app service's DATABASE_URL at the new database (reference syntax — no secret ever read or printed here)
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          # Built via printf's octal escape (\044 = "$") so the literal
          # 3-char sequence "$" "{" "{" never appears in this file's raw
          # text — GitHub Actions' own expression parser intercepts that
          # sequence anywhere in a run: block, even inside quotes/escapes,
          # which is what broke the first two attempts at this step.
          REF=$(printf '\044{{%s.DATABASE_URL}}' "$DB_SERVICE_NAME")
          railway variables \
            --service "$APP_SERVICE_NAME" \
            --environment "$APP_ENV_NAME" \
            --set "DATABASE_URL=${REF}"

      - name: Set a temporary public-reachable migration URL on the app service (removed after migration)
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          REF=$(printf '\044{{%s.DATABASE_PUBLIC_URL}}' "$DB_SERVICE_NAME")
          railway variables \
            --service "$APP_SERVICE_NAME" \
            --environment "$APP_ENV_NAME" \
            --set "MIGRATION_DATABASE_URL=${REF}"

      - name: Run the drizzle migration (creates portal_users, resources, failed_submissions from the corrected schema)
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          railway run --service "$APP_SERVICE_NAME" --environment "$APP_ENV_NAME" -- \
            sh -c 'DATABASE_URL="$MIGRATION_DATABASE_URL" pnpm run db:push'

      - name: Remove the temporary migration URL variable
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          railway variables \
            --service "$APP_SERVICE_NAME" \
            --environment "$APP_ENV_NAME" \
            --set "MIGRATION_DATABASE_URL="
