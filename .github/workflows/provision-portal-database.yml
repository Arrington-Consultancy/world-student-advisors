name: Apply portal schema migration (one-time)

# Manual-only, one-time step. Content replaced 2026-08-10 — this file
# previously attempted full database provisioning (railway add) and failed
# ("Project not found. Run `railway link`", a Project Token limitation, not
# a code bug); the database was provisioned manually via the Railway
# dashboard instead, and DATABASE_URL is already set on the
# world-student-advisors production service as a reference to the MySQL
# service. This workflow no longer provisions anything and never touches
# DATABASE_URL — it only:
#   1. runs the drizzle migration (pnpm run db:push) against the corrected
#      schema on this branch (pipedriveObjectType / pipedriveObjectId,
#      replacing the old incompatible integer pipedriveDealId column) using
#      the existing production Railway/project credentials, against the
#      already-connected production MySQL database, then
#   2. verifies the live schema by listing every table and, for
#      portal_users specifically (the table the fix applies to), every
#      column with type/nullability — metadata only, never row data, never
#      the connection string.
on:
  workflow_dispatch:
    inputs:
      service_name:
        description: "Railway app service name"
        required: true
        default: "world-student-advisors"
      environment_name:
        description: "Railway environment name"
        required: true
        default: "production"

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      APP_SERVICE_NAME: ${{ github.event.inputs.service_name }}
      APP_ENV_NAME: ${{ github.event.inputs.environment_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Apply the corrected portal schema (pnpm run db:push)
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          railway run --service "$APP_SERVICE_NAME" --environment "$APP_ENV_NAME" -- pnpm run db:push

      - name: Verify live schema — every table, then portal_users columns (metadata only, no row data)
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          railway run --service "$APP_SERVICE_NAME" --environment "$APP_ENV_NAME" -- node scripts/prod-db-diagnostic.mjs
