name: Reporting mirror acceptance (Pipedrive to Google Drive)

# Manual only. Runs one mirror sync against production and proves: the
# Google grant is drive.file only; the run is recorded; the credential can
# see only the mirror folder and its four files; the manifest is complete
# and every file matches it; the columns are exactly the allowlist; the
# resolver rebuilds evidence from the mirror. Prints counts, names and
# hashes only. Never prints a token or a record value.
# Auth: githubactionsprod, the production-scoped Railway Project Token.
on:
  workflow_dispatch: {}

jobs:
  accept:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Discover the MySQL public-URL variable NAME (key only, value never printed)
        id: discover
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          KEYS=$(railway variables --service "MySQL" --environment "production" --json | jq -r 'keys[]')
          PUBLIC_KEY=$(echo "$KEYS" | grep -i -E '^(MYSQL_PUBLIC_URL|DATABASE_PUBLIC_URL)$' | head -n1)
          if [ -z "$PUBLIC_KEY" ]; then echo "No public-URL-shaped variable found on MySQL. Stopping."; exit 1; fi
          echo "public_key=$PUBLIC_KEY" >> "$GITHUB_OUTPUT"
      - name: Set a temporary database URL reference on the app service
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
          PUBLIC_KEY: ${{ steps.discover.outputs.public_key }}
        run: |
          REF=$(printf '\044{{%s.%s}}' "MySQL" "$PUBLIC_KEY")
          railway variables --service "world-student-advisors" --environment "production" \
            --set "MIRROR_ACCEPTANCE_DATABASE_URL=${REF}" --skip-deploys
      - name: Run the acceptance inside the service variables (read only on the CRM)
        timeout-minutes: 10
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          railway run --service "world-student-advisors" --environment "production" -- \
            sh -c 'DATABASE_URL="$MIRROR_ACCEPTANCE_DATABASE_URL" pnpm exec tsx scripts/mirror-acceptance.ts'
      - name: Remove the temporary database URL reference
        if: always()
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          railway variables --service "world-student-advisors" --environment "production" \
            --set "MIRROR_ACCEPTANCE_DATABASE_URL=" --skip-deploys
