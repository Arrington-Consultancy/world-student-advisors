name: Google Ads Qualified Lead acceptance (production, Data Manager API)

# Manual only. Proves the WSA-owned conversion uploads against production,
# the Qualified Lead and (since 14 October 2026) the Enquiry: configuration,
# a Data Manager access token, a validateOnly upload to each real conversion
# action (Google records nothing), the upload record table, the Google-side
# status of recent uploads, and Pipedrive deal and lead counts. Optionally
# runs the Enquiry dry run (validateOnly, nothing recorded) and one real run
# of each sync.
# Prints counts, ids, statuses and reasons only: never a token, an email, a
# phone number or a click identifier. Runs inside the service's variables
# with a public database URL substituted, following the other acceptance
# workflows. Auth: githubactionsprod, the production-scoped Railway Project Token.
on:
  workflow_dispatch:
    inputs:
      run_sync:
        description: "Also run one real run of each sync (sends real conversions if any are unrecorded and that sync's switch is on). yes or no."
        required: false
        default: "no"
      enquiry_dry_run:
        description: "Also run the Enquiry dry run: every Lead the sync would send goes to Google with validateOnly, nothing is recorded. yes or no."
        required: false
        default: "no"

jobs:
  accept:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Discover the MySQL public-URL variable NAME (key only, value never printed)
        id: discover
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          KEYS=$(railway variables --service "MySQL" --environment "production" --json | jq -r 'keys[]')
          PUBLIC_KEY=$(echo "$KEYS" | grep -i -E '^(MYSQL_PUBLIC_URL|DATABASE_PUBLIC_URL)$' | head -n1)
          if [ -z "$PUBLIC_KEY" ]; then echo "No public-URL-shaped variable found on MySQL. Stopping."; exit 1; fi
          echo "public_key=$PUBLIC_KEY" >> "$GITHUB_OUTPUT"
      - name: Set a temporary database URL reference on the app service
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
          PUBLIC_KEY: ${{ steps.discover.outputs.public_key }}
        run: |
          REF=$(printf '\044{{%s.%s}}' "MySQL" "$PUBLIC_KEY")
          railway variables --service "world-student-advisors" --environment "production" \
            --set "GOOGLE_ADS_ACCEPTANCE_DATABASE_URL=${REF}" --skip-deploys
      - name: Run the acceptance inside the service variables
        timeout-minutes: 10
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
          RUN_SYNC: ${{ github.event.inputs.run_sync }}
          ENQUIRY_DRY_RUN: ${{ github.event.inputs.enquiry_dry_run }}
        run: |
          E2E_RUN_SYNC=0; if [ "$RUN_SYNC" = "yes" ]; then E2E_RUN_SYNC=1; fi
          E2E_ENQUIRY_DRY_RUN=0; if [ "$ENQUIRY_DRY_RUN" = "yes" ]; then E2E_ENQUIRY_DRY_RUN=1; fi
          railway run --service "world-student-advisors" --environment "production" -- \
            sh -c "DATABASE_URL=\"\$GOOGLE_ADS_ACCEPTANCE_DATABASE_URL\" E2E_RUN_SYNC=$E2E_RUN_SYNC E2E_ENQUIRY_DRY_RUN=$E2E_ENQUIRY_DRY_RUN pnpm exec tsx scripts/google-ads-qualified-lead-acceptance.ts"
      - name: Remove the temporary database URL reference
        if: always()
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          railway variables --service "world-student-advisors" --environment "production" \
            --set "GOOGLE_ADS_ACCEPTANCE_DATABASE_URL=" --skip-deploys
