name: Check Student Support Library links

# THROWAWAY DIAGNOSTIC VERSION (branch claude/diag-youtube-017 only; never for
# merge). Read-only: asks YouTube why a recording is not playable through
# oEmbed. No secrets, changes nothing.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query YouTube
        run: |
          for id in mLDmQplce-o WqNU_CRy_p8 xlJOfunvQYM; do
            echo "=== $id ==="
            echo -n "oembed HTTP: "; curl -sS -o /tmp/oembed.json -w '%{http_code}\n' "https://www.youtube.com/oembed?url=https%3A%2F%2Fwww.youtube.com%2Fwatch%3Fv%3D$id&format=json" || true
            head -c 400 /tmp/oembed.json; echo
            curl -sS -L -A "Mozilla/5.0" -o /tmp/watch.html -w 'watch HTTP: %{http_code}\n' "https://www.youtube.com/watch?v=$id" || true
            echo -n "watch <title>: "; grep -o '<title>[^<]*</title>' /tmp/watch.html | head -1; echo
            echo "watch playabilityStatus:"; grep -o '"playabilityStatus":{[^}]*}' /tmp/watch.html | head -1 | cut -c1-700; echo
            grep -o '"reason":"[^"]*"' /tmp/watch.html | head -3
            grep -o '"isUnlisted":[a-z]*' /tmp/watch.html | head -1
            grep -o '"isPrivate":[a-z]*' /tmp/watch.html | head -1
            grep -o '"playableInEmbed":[a-z]*' /tmp/watch.html | head -1
            curl -sS -L -A "Mozilla/5.0" -o /tmp/embed.html -w 'embed HTTP: %{http_code}\n' "https://www.youtube-nocookie.com/embed/$id" || true
            echo "embed playabilityStatus:"; grep -o '"playabilityStatus":{[^}]*}' /tmp/embed.html | head -1 | cut -c1-700; echo
            grep -o '"previewPlayabilityStatus":{[^}]*}' /tmp/embed.html | head -1 | cut -c1-400
            echo
          done
