name: Worker CRM end-to-end (production, natural question)

# Manual only. A staff member's natural question that names a real student
# is routed, the student is identified under that staff member's own
# authority, the worker reads the live WSA Pipedrive record through the OAuth
# grant, and the model answers. Runs inside the service's variables with a
# public database URL substituted, following connector-pipedrive-acceptance.
# Prints booleans, counts, ids and stage labels only: never contact details,
# never the answer text. Writes the audit rows the real path writes and
# nothing else; the CRM is only read.
# Auth: githubactionsprod, the production-scoped Railway Project Token.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "e2e: ask the question through the deployed procedure. inspect: shape of stored replies (reads only). diagnose: why recent questions did or did not find a student (reads only; question input is treated as the surname to look for). interview: interview preparation with a fictional student (question input is the interview kind)."
        required: false
        default: "e2e"
        type: choice
        options: [e2e, inspect, diagnose, interview]
      question:
        description: "The natural staff question, naming the student (e2e mode)"
        required: false
        default: ""
      staff_email:
        description: "Staff account to act as (default: the deployment's ACCESS_BOOTSTRAP_EMAIL)"
        required: false
        default: ""
      worker:
        description: "Worker id to force (default: whatever the router chooses)"
        required: false
        default: ""
      follow_up:
        description: "e2e mode: optional short second message sent into the same conversation after the first answer (e.g. yes, go ahead, no thanks)"
        required: false
        default: ""
      show_questions:
        description: "diagnose mode only: 1 prints the acting staff member's own stored questions inside from..to"
        required: false
        default: ""
      from:
        description: "diagnose mode only: ISO start of the window for show_questions"
        required: false
        default: ""
      to:
        description: "diagnose mode only: ISO end of the window for show_questions"
        required: false
        default: ""

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Discover the MySQL public-URL variable NAME (key only, value never printed)
        id: discover
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          KEYS=$(railway variables --service "MySQL" --environment "production" --json | jq -r 'keys[]')
          PUBLIC_KEY=$(echo "$KEYS" | grep -i -E '^(MYSQL_PUBLIC_URL|DATABASE_PUBLIC_URL)$' | head -n1)
          if [ -z "$PUBLIC_KEY" ]; then echo "No public-URL-shaped variable found on MySQL. Stopping."; exit 1; fi
          echo "public_key=$PUBLIC_KEY" >> "$GITHUB_OUTPUT"
      - name: Set a temporary database URL reference on the app service
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
          PUBLIC_KEY: ${{ steps.discover.outputs.public_key }}
        run: |
          REF=$(printf '\044{{%s.%s}}' "MySQL" "$PUBLIC_KEY")
          railway variables --service "world-student-advisors" --environment "production" \
            --set "WORKER_E2E_DATABASE_URL=${REF}" --skip-deploys
      - name: Run the end-to-end test inside the service variables
        timeout-minutes: 10
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
          E2E_QUESTION: ${{ github.event.inputs.question }}
          E2E_STAFF_EMAIL: ${{ github.event.inputs.staff_email }}
          E2E_WORKER: ${{ github.event.inputs.worker }}
          E2E_FOLLOW_UP: ${{ github.event.inputs.follow_up }}
          E2E_MODE: ${{ github.event.inputs.mode }}
          E2E_SHOW_QUESTIONS: ${{ github.event.inputs.show_questions }}
          E2E_FROM: ${{ github.event.inputs.from }}
          E2E_TO: ${{ github.event.inputs.to }}
        run: |
          SCRIPT=scripts/worker-crm-e2e.ts
          if [ "$E2E_MODE" = "inspect" ]; then SCRIPT=scripts/worker-answer-shape.ts; fi
          if [ "$E2E_MODE" = "diagnose" ]; then SCRIPT=scripts/worker-question-diagnose.ts; fi
          # interview: the fictional-student interview preparation; the question input carries the interview kind.
          if [ "$E2E_MODE" = "interview" ]; then SCRIPT=scripts/interview-preparation-e2e.ts; fi
          railway run --service "world-student-advisors" --environment "production" -- \
            sh -c "DATABASE_URL=\"\$WORKER_E2E_DATABASE_URL\" E2E_QUESTION=\"\$E2E_QUESTION\" E2E_STAFF_EMAIL=\"\$E2E_STAFF_EMAIL\" E2E_WORKER=\"\$E2E_WORKER\" E2E_FOLLOW_UP=\"\$E2E_FOLLOW_UP\" E2E_SURNAME=\"\$E2E_QUESTION\" E2E_KIND=\"\$E2E_QUESTION\" E2E_SHOW_QUESTIONS=\"\$E2E_SHOW_QUESTIONS\" E2E_FROM=\"\$E2E_FROM\" E2E_TO=\"\$E2E_TO\" pnpm exec tsx $SCRIPT"
      - name: Remove the temporary database URL reference
        if: always()
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          railway variables --service "world-student-advisors" --environment "production" \
            --set "WORKER_E2E_DATABASE_URL=" --skip-deploys
