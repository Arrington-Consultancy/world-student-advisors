name: Deploy the executive password hash

# Sets EXECUTIVE_PASSWORD_HASH in Railway production, under the Executive
# Shared Access Override approved by Tom Arrington on 31 August 2026.
#
# WHY THE PASSWORD ARRIVES AS A REPOSITORY SECRET, AND NOT AS AN INPUT.
# workflow_dispatch inputs are displayed in plain text on the run page to
# anyone who can read this repository's Actions, and they persist in the run
# history. For a permanent, unrestricted, MFA-free credential that would be
# self-defeating. A repository secret is encrypted at rest, is never
# displayed, and is automatically redacted from every log line. So Tom sets
# the secret once, this workflow consumes it, and he deletes it afterwards.
#
# WHAT NEVER HAPPENS HERE. The password is never written to a file, echoed,
# passed as a step output, or included in an error message. The resulting
# hash is masked before it exists in any variable that could be printed, and
# is passed to Railway through the CLI rather than through anything that
# logs its arguments. Neither value is ever committed, and neither is ever
# reported back to a person: the run says whether it worked, not what it
# used.
#
# ORDER. Migration 0009 must be applied first. It widens the audit
# authMethod enum to accept shared_executive, and until it has, the first
# executive sign-in would write an audit row the column rejects. The check
# below enforces that rather than trusting the operator to remember it.
on:
  workflow_dispatch:
    inputs:
      service_name:
        description: "Railway app service name"
        required: true
        default: "world-student-advisors"
      environment_name:
        description: "Railway environment name"
        required: true
        default: "production"
      database_service_name:
        description: "Railway MySQL service name"
        required: true
        default: "MySQL"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_SERVICE_NAME: ${{ github.event.inputs.service_name }}
      APP_ENV_NAME: ${{ github.event.inputs.environment_name }}
      DB_SERVICE_NAME: ${{ github.event.inputs.database_service_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Refuse to run without the password secret
        env:
          EXECUTIVE_PASSWORD: ${{ secrets.EXECUTIVE_PASSWORD }}
        run: |
          if [ -z "$EXECUTIVE_PASSWORD" ]; then
            echo "The EXECUTIVE_PASSWORD repository secret is not set."
            echo "Add it under Settings > Secrets and variables > Actions, then dispatch again."
            echo "Nothing has been changed."
            exit 1
          fi
          echo "The password secret is present. Its value is not read by this step."

      - name: Confirm migration 0009 is applied, so the audit column accepts shared_executive
        timeout-minutes: 10
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          KEYS=$(railway variables --service "$DB_SERVICE_NAME" --environment "$APP_ENV_NAME" --json | jq -r 'keys[]')
          PUBLIC_KEY=$(echo "$KEYS" | grep -i -E '^(MYSQL_PUBLIC_URL|DATABASE_PUBLIC_URL)$' | head -n1)
          if [ -z "$PUBLIC_KEY" ]; then
            echo "No public-URL-shaped variable found on $DB_SERVICE_NAME. Stopping."
            exit 1
          fi
          REF=$(printf '\044{{%s.%s}}' "$DB_SERVICE_NAME" "$PUBLIC_KEY")
          railway variables --service "$APP_SERVICE_NAME" --environment "$APP_ENV_NAME" \
            --set "MIGRATION_DATABASE_URL=${REF}"
          railway run --service "$APP_SERVICE_NAME" --environment "$APP_ENV_NAME" -- \
            sh -c 'DATABASE_URL="$MIGRATION_DATABASE_URL" node scripts/check-audit-accepts-executive.mjs'

      - name: Remove the temporary migration URL variable
        if: always()
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          railway variables --service "$APP_SERVICE_NAME" --environment "$APP_ENV_NAME" \
            --set "MIGRATION_DATABASE_URL="

      # Hashing and deployment happen in ONE step on purpose. The hash never
      # becomes a step output or a file, so it exists only inside this
      # shell's memory for the length of the step.
      - name: Hash the password and set it in Railway
        env:
          EXECUTIVE_PASSWORD: ${{ secrets.EXECUTIVE_PASSWORD }}
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          HASH=$(node scripts/hash-executive-password.mjs)
          echo "::add-mask::$HASH"
          if [ -z "$HASH" ]; then
            echo "Hashing produced nothing. Stopping without changing anything."
            exit 1
          fi
          railway variables --service "$APP_SERVICE_NAME" --environment "$APP_ENV_NAME" \
            --set "EXECUTIVE_PASSWORD_HASH=$HASH"
          echo "EXECUTIVE_PASSWORD_HASH has been set. Its value was not printed."

      # Reads the value BACK from Railway rather than reusing the one just
      # sent, so this is a verification and not an echo.
      - name: Verify the deployed hash accepts the intended password and nothing else
        env:
          EXECUTIVE_PASSWORD: ${{ secrets.EXECUTIVE_PASSWORD }}
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          DEPLOYED=$(railway variables --service "$APP_SERVICE_NAME" --environment "$APP_ENV_NAME" --json \
            | jq -r '.EXECUTIVE_PASSWORD_HASH // ""')
          echo "::add-mask::$DEPLOYED"
          DEPLOYED_HASH="$DEPLOYED" node scripts/verify-executive-hash.mjs

      # Runs inside the app service's own environment, so the variables it
      # reads are the ones the running application actually receives. It
      # never authenticates, because authenticating would need the password
      # and this job must not hold it beyond the hashing step.
      - name: Verify the route in production, and that nothing else moved
        timeout-minutes: 10
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          KEYS=$(railway variables --service "$DB_SERVICE_NAME" --environment "$APP_ENV_NAME" --json | jq -r 'keys[]')
          PUBLIC_KEY=$(echo "$KEYS" | grep -i -E '^(MYSQL_PUBLIC_URL|DATABASE_PUBLIC_URL)$' | head -n1)
          REF=$(printf '\044{{%s.%s}}' "$DB_SERVICE_NAME" "$PUBLIC_KEY")
          railway variables --service "$APP_SERVICE_NAME" --environment "$APP_ENV_NAME" \
            --set "MIGRATION_DATABASE_URL=${REF}"
          railway run --service "$APP_SERVICE_NAME" --environment "$APP_ENV_NAME" -- \
            sh -c 'DATABASE_URL="$MIGRATION_DATABASE_URL" node scripts/verify-executive-route.mjs'

      - name: Remove the temporary migration URL variable again
        if: always()
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          railway variables --service "$APP_SERVICE_NAME" --environment "$APP_ENV_NAME" \
            --set "MIGRATION_DATABASE_URL="

      # The secret has served its purpose. Every day it stays is a day the
      # password sits in a second place it does not need to be, so deletion
      # is attempted here rather than left as a task somebody remembers.
      #
      # GITHUB_TOKEN may not be permitted to manage Actions secrets. If it
      # is refused, that is reported plainly and the run does NOT pass off
      # a manual step as done.
      - name: Delete the EXECUTIVE_PASSWORD repository secret
        id: cleanup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/secrets/EXECUTIVE_PASSWORD")
          echo "delete status: $STATUS"
          if [ "$STATUS" = "204" ]; then
            echo "DELETED: the EXECUTIVE_PASSWORD secret no longer exists."
            echo "deleted=true" >> "$GITHUB_OUTPUT"
          else
            echo "NOT DELETED (HTTP $STATUS). The automatic token is not permitted to"
            echo "manage repository secrets, which is a GitHub restriction and not a"
            echo "failure of this deployment. A person must delete EXECUTIVE_PASSWORD"
            echo "under Settings, Secrets and variables, Actions."
            echo "deleted=false" >> "$GITHUB_OUTPUT"
          fi

      # Proves the deletion rather than trusting the status code, by asking
      # GitHub whether the secret still exists.
      - name: Confirm the secret is gone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/secrets/EXECUTIVE_PASSWORD")
          if [ "$STATUS" = "404" ]; then
            echo "CONFIRMED: EXECUTIVE_PASSWORD does not exist. Deletion verified."
          elif [ "$STATUS" = "200" ]; then
            echo "STILL PRESENT: EXECUTIVE_PASSWORD exists and must be deleted by a person."
          else
            echo "UNCONFIRMED (HTTP $STATUS): this token cannot read the secret list, so"
            echo "deletion could not be verified either way. Treat it as not deleted."
          fi

      - name: What happens next
        run: |
          echo "Railway redeploys the service on a variable change, so the executive"
          echo "route becomes usable once that deployment finishes."
