name: Import website assets from SharePoint (read only)

# Manual only. Downloads the partner assets Tom Arrington uploaded to the
# controlled SharePoint folder 16_WEBSITE_Ai/05 Landing Pages/Juliet/Website
# Assets on 25 September 2026 and commits them to the branch given, so the
# Partners page can serve them. Same mechanism and same credential as
# fetch-team-assets.yml: the import runs inside the Railway service through
# `railway run`, reusing the SHAREPOINT_GRAPH_* application already trusted
# for read-only SharePoint access. Never prints a token. Writes nothing to
# SharePoint.
#
# asset_set "pmiq" (added 22 November 2026) imports Tim Hunt's Pre-Mock
# Interview Questionnaires for the Student Support Library through
# scripts/fetch-pmiq-assets.mjs, by the same route and credential. The PDFs
# are committed to client/public/downloads/pmiq. The Pre-CAS Interview video
# is Birmingham City University's own, so the page embeds their YouTube
# upload and nothing here imports it. The default, "partners", does exactly
# what this workflow did before.
on:
  workflow_dispatch:
    inputs:
      service_name:
        description: "Railway app service name"
        required: true
        default: "world-student-advisors"
      environment_name:
        description: "Railway environment name"
        required: true
        default: "production"
      target_branch:
        description: "Branch to commit the imported assets to"
        required: true
        default: "main"
      asset_set:
        description: "Which assets to import"
        required: true
        default: "partners"
        type: choice
        options:
          - partners
          - pmiq

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Import the assets
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
          ASSET_SET: ${{ github.event.inputs.asset_set }}
        run: |
          case "$ASSET_SET" in
            partners) script=scripts/fetch-website-assets.mjs ;;
            pmiq) script=scripts/fetch-pmiq-assets.mjs ;;
            *) echo "Unknown asset set."; exit 1 ;;
          esac
          railway run \
            --service "${{ github.event.inputs.service_name }}" \
            --environment "${{ github.event.inputs.environment_name }}" \
            -- node "$script"
      - name: Commit the imported assets
        env:
          ASSET_SET: ${{ github.event.inputs.asset_set }}
          TARGET_BRANCH: ${{ github.event.inputs.target_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          case "$ASSET_SET" in
            partners)
              folder=client/public/partners
              message="Import partner website assets from SharePoint (Study Group, UCLan Cyprus, University of Debrecen)" ;;
            pmiq)
              folder="client/public/downloads/pmiq"
              message="Import Tim Hunt's Pre-Mock Interview Questionnaires from SharePoint (24 PDFs)" ;;
          esac
          git add $folder
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "$message"
          git push origin "HEAD:$TARGET_BRANCH"
          ls -l $folder
