name: Connector acceptance - worker SharePoint (read only)

# Manual only. Verifies the dedicated worker SharePoint application against
# production: token, held permissions (names), WSA site resolution, and a
# listing of every designated worker location. Writes exactly one
# non-secret identifier, SHAREPOINT_GRAPH_SITE_ID, when the site resolves,
# because the code pins every worker to that id and cannot resolve it
# itself without the consent this run is checking for.
#
# Never prints a token or secret. Reads no file content.
# Auth: githubactionsprod, the production-scoped Railway Project Token.
on:
  workflow_dispatch:
    inputs:
      service_name:
        description: "Railway app service name"
        required: true
        default: "world-student-advisors"
      environment_name:
        description: "Railway environment name"
        required: true
        default: "production"

jobs:
  accept:
    runs-on: ubuntu-latest
    env:
      APP_SERVICE_NAME: ${{ github.event.inputs.service_name }}
      APP_ENV_NAME: ${{ github.event.inputs.environment_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Run the acceptance inside the service (read only)
        id: accept
        timeout-minutes: 5
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          set +e
          railway run --service "$APP_SERVICE_NAME" --environment "$APP_ENV_NAME" -- \
            node scripts/connector-sharepoint-acceptance.mjs | tee acceptance.log
          STATUS=${PIPESTATUS[0]}
          SITE_ID=$(grep -E '^SITE_ID=' acceptance.log | head -n1 | cut -d= -f2-)
          echo "site_id=$SITE_ID" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Record the WSA site id on the service (identifier, not a secret)
        if: steps.accept.outputs.site_id != ''
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
          SITE_ID: ${{ steps.accept.outputs.site_id }}
        run: |
          railway variables --service "$APP_SERVICE_NAME" --environment "$APP_ENV_NAME" \
            --set "SHAREPOINT_GRAPH_SITE_ID=${SITE_ID}"
          echo "SHAREPOINT_GRAPH_SITE_ID set."
      - name: Result
        run: |
          echo "acceptance exit status: ${{ steps.accept.outputs.status }}"
          test "${{ steps.accept.outputs.status }}" = "0"
