name: Apply migration 0014 (Staff Portal per-user session invalidation)

# Manual-only, one-time, SEPARATELY AUTHORISED step (authorisation limited
# to migration 0014). Mirrors the proven method of apply-migration-0013.yml:
# discover the MySQL public-URL variable NAME, set MIGRATION_DATABASE_URL as
# a Railway reference (the connection string is never read or printed), run
# a read-only pre-check, apply with `drizzle-kit migrate`, verify, run the
# migrator a second time to prove idempotence, verify again, and always
# clear the temporary variable.
#
# 0014 IS ONE ADDITIVE STATEMENT. It adds staff_users.sessionVersion as INT
# NOT NULL DEFAULT 1. There is no MODIFY, so no existing column changes
# shape, and the default means every existing row is given a defined value
# by the ALTER itself with no row left null. scripts/precheck-0014.mjs
# allows exactly that one statement by shape and stops on anything else,
# including any MODIFY, DROP, DELETE, TRUNCATE, RENAME, UPDATE or INSERT.
#
# What it enforces: Staff Portal Access Control Standard v1.0 (APPROVED,
# 30 August 2026) §9, "Access must be removed or changed promptly when staff
# role, employment, team or responsibilities change", and "Permission denial
# must fail closed". Before this column a signed staff token stayed valid for
# its full twelve hours whatever happened to the account behind it. This is
# enforcement of an approved control, not a change to one: no access level,
# functional scope, case scope, sensitive overlay or SSO rule is altered.
#
# ONE OPERATIONAL CONSEQUENCE, stated deliberately. Tokens minted before this
# carry no version claim and are refused once, so anybody signed in at the
# moment of deployment signs in again. That is the fail-closed reading:
# treating a missing claim as exempt would leave exactly the sessions this
# control exists to cut running unchallenged.
#
# Rollback would require DROP COLUMN, which is destructive, and is
# deliberately not provided.
#
# Auth: githubactionsprod — the same production-scoped Railway Project
# Token the other production workflows use. No credential is read, printed
# or handled by a person at any point.
on:
  workflow_dispatch:
    inputs:
      service_name:
        description: "Railway app service name"
        required: true
        default: "world-student-advisors"
      environment_name:
        description: "Railway environment name"
        required: true
        default: "production"
      database_service_name:
        description: "Railway MySQL service name"
        required: true
        default: "MySQL"

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      APP_SERVICE_NAME: ${{ github.event.inputs.service_name }}
      APP_ENV_NAME: ${{ github.event.inputs.environment_name }}
      DB_SERVICE_NAME: ${{ github.event.inputs.database_service_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Discover the MySQL service's public-URL variable NAME (key only, value never printed)
        id: discover
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          KEYS=$(railway variables --service "$DB_SERVICE_NAME" --environment "$APP_ENV_NAME" --json | jq -r 'keys[]')
          PUBLIC_KEY=$(echo "$KEYS" | grep -i -E '^(MYSQL_PUBLIC_URL|DATABASE_PUBLIC_URL)$' | head -n1)
          if [ -z "$PUBLIC_KEY" ]; then
            echo "No public-URL-shaped variable found on $DB_SERVICE_NAME. Stopping — not guessing further."
            exit 1
          fi
          echo "Using public URL variable: $PUBLIC_KEY"
          echo "public_key=$PUBLIC_KEY" >> "$GITHUB_OUTPUT"

      - name: Set a temporary public-reachable migration URL on the app service
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
          PUBLIC_KEY: ${{ steps.discover.outputs.public_key }}
        run: |
          REF=$(printf '\044{{%s.%s}}' "$DB_SERVICE_NAME" "$PUBLIC_KEY")
          railway variables \
            --service "$APP_SERVICE_NAME" \
            --environment "$APP_ENV_NAME" \
            --set "MIGRATION_DATABASE_URL=${REF}"

      - name: Confirm 0014 is the only pending migration (read-only; stops rather than guessing)
        timeout-minutes: 10
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          railway run --service "$APP_SERVICE_NAME" --environment "$APP_ENV_NAME" -- \
            sh -c 'DATABASE_URL="$MIGRATION_DATABASE_URL" node scripts/precheck-0014.mjs'

      - name: Apply migration 0014 (drizzle-kit migrate)
        timeout-minutes: 10
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          railway run --service "$APP_SERVICE_NAME" --environment "$APP_ENV_NAME" -- \
            sh -c 'DATABASE_URL="$MIGRATION_DATABASE_URL" pnpm exec drizzle-kit migrate'

      - name: Read-only post-migration verification
        timeout-minutes: 10
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          railway run --service "$APP_SERVICE_NAME" --environment "$APP_ENV_NAME" -- \
            sh -c 'DATABASE_URL="$MIGRATION_DATABASE_URL" node scripts/verify-0014.mjs'

      - name: Re-run the migrator to prove it is idempotent (applies nothing the second time)
        timeout-minutes: 10
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          railway run --service "$APP_SERVICE_NAME" --environment "$APP_ENV_NAME" -- \
            sh -c 'DATABASE_URL="$MIGRATION_DATABASE_URL" pnpm exec drizzle-kit migrate'

      - name: Verify again — the second migrate run changed nothing
        timeout-minutes: 10
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          railway run --service "$APP_SERVICE_NAME" --environment "$APP_ENV_NAME" -- \
            sh -c 'DATABASE_URL="$MIGRATION_DATABASE_URL" node scripts/verify-0014.mjs'

      - name: Remove the temporary migration URL variable
        if: always()
        env:
          RAILWAY_TOKEN: ${{ secrets.githubactionsprod }}
        run: |
          railway variables \
            --service "$APP_SERVICE_NAME" \
            --environment "$APP_ENV_NAME" \
            --set "MIGRATION_DATABASE_URL="
